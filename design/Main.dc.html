<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0a; }
    a { color: #b45309; } a:hover { color: #92400e; }
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@200;300&display=swap');
    .label-rule { width: 320px; height: 1px; background: rgba(100,94,84,0.45); margin-bottom: 12px; }
    .label-primary { font-family: 'Jost', system-ui, sans-serif; font-size: 11px; font-weight: 200; letter-spacing: 0.30em; color: #f0ece4; text-transform: uppercase; }
    .label-secondary { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: 15px; font-weight: 300; color: rgba(240,236,228,0.72); margin-top: 6px; }
    .label-datum { font-family: 'Jost', system-ui, sans-serif; font-size: 9px; font-weight: 200; letter-spacing: 0.22em; color: rgba(240,236,228,0.38); }
    .tag { display: inline-block; border: 1px solid rgba(240,236,228,0.22); padding: 3px 10px; font-family: 'Jost', system-ui, sans-serif; font-size: 9px; font-weight: 200; letter-spacing: 0.18em; color: rgba(240,236,228,0.45); text-transform: uppercase; margin-right: 8px; }
  </style>
</helmet>

<div style="width:1600px;height:900px;position:relative;overflow:hidden;background:#1a1714;">

  <!-- ── Photorealistic render as full-bleed background ── -->
  <img src="render_canvas.jpg"
       style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;"
       alt="Meridian Warmth interior render">

  <!-- ── Subtle vignette overlay ── -->
  <div style="position:absolute;inset:0;background:radial-gradient(ellipse 120% 100% at 50% 50%,transparent 45%,rgba(8,6,4,0.28) 100%);pointer-events:none;"></div>

  <!-- ── Bottom label band ── -->
  <div style="position:absolute;bottom:0;left:0;right:0;height:88px;background:linear-gradient(180deg,transparent 0%,rgba(8,6,4,0.72) 100%);pointer-events:none;"></div>

  <!-- ── Typography: lower-left ── -->
  <div style="position:absolute;bottom:26px;left:52px;">
    <div class="label-rule"></div>
    <div style="display:flex;align-items:baseline;gap:24px;">
      <span class="label-primary">Meridian Warmth</span>
      <span class="label-datum">8K · V-RAY STUDY</span>
    </div>
    <div class="label-secondary">Open-Plan Workstation Bay · Architectural Study</div>
  </div>

  <!-- ── Tags: lower-right ── -->
  <div style="position:absolute;bottom:36px;right:52px;display:flex;align-items:center;">
    <span class="tag">Cherry Veneer</span>
    <span class="tag">Terrazzo</span>
    <span class="tag">Acoustic Panels</span>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1600,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
